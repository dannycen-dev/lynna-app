name: Deploy

# Reutilizable: migra la D1 del entorno y despliega el Worker. Las migraciones van ANTES del
# deploy, así que deben ser compatibles con la versión anterior del código (expand → contract).
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.host.outputs.url }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Dominio del entorno
        id: host
        run: |
          case "${{ inputs.environment }}" in
            dev) host=devlynna ;; stg) host=stglynna ;; prod) host=lynna ;;
            *) echo "::error::Entorno desconocido"; exit 1 ;;
          esac
          echo "url=https://$host.igniastudio.mx" >> "$GITHUB_OUTPUT"
      - name: Verificar credenciales
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN (repo o environment '${{ inputs.environment }}')."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migraciones D1
        run: pnpm --filter @lynna/api db:migrate:${{ inputs.environment }}
      - name: Verificar que no queden migraciones pendientes
        # Nunca desplegar código contra una base desactualizada (un fallo silencioso de la migración lo permitiría).
        run: |
          out=$(pnpm --filter @lynna/api exec wrangler d1 migrations list DB --env ${{ inputs.environment }} --remote 2>&1)
          echo "$out"
          echo "$out" | grep -q "No migrations to apply" || { echo "::error::Quedaron migraciones pendientes en ${{ inputs.environment }}."; exit 1; }
      - name: Deploy
        run: pnpm --filter @lynna/api deploy:${{ inputs.environment }}
      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            body=$(curl -fsS "${{ steps.host.outputs.url }}/health") && echo "$body" && \
              echo "$body" | grep -q '"env":"${{ inputs.environment }}"' && exit 0
            sleep 5
          done
          echo "::error::El health check de ${{ inputs.environment }} no respondió como se esperaba."
          exit 1
      - name: Navegador para Playwright
        run: pnpm --filter @lynna/e2e exec playwright install --with-deps chromium
      - name: Smoke E2E (Playwright, solo lectura)
        env:
          E2E_BASE_URL: ${{ steps.host.outputs.url }}
          E2E_EXPECT_ENV: ${{ inputs.environment }}
        run: pnpm e2e:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-smoke-${{ inputs.environment }}
          path: apps/e2e/playwright-report
          retention-days: 7
